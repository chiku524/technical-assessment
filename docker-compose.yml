services:
  postgres:
    image: postgres:15-alpine
    container_name: school_mgmt_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: school_mgmt
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./seed_db/tables.sql:/docker-entrypoint-initdb.d/01-tables.sql:ro
      - ./seed_db/seed-db.sql:/docker-entrypoint-initdb.d/02-seed-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d school_mgmt"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: school_mgmt_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5007:5007"
    environment:
      PORT: 5007
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/school_mgmt
      JWT_ACCESS_TOKEN_SECRET: docker_access_token_secret_change_me
      JWT_REFRESH_TOKEN_SECRET: docker_refresh_token_secret_change_me
      JWT_ACCESS_TOKEN_TIME_IN_MS: 900000
      JWT_REFRESH_TOKEN_TIME_IN_MS: 28800000
      CSRF_TOKEN_SECRET: docker_csrf_secret_change_me
      CSRF_TOKEN_TIME_IN_MS: 950000
      MAIL_FROM_USER: noreply@school.local
      RESEND_API_KEY: re_dummy_key
      EMAIL_VERIFICATION_TOKEN_SECRET: docker_email_verification_secret
      EMAIL_VERIFICATION_TOKEN_TIME_IN_MS: 18000000
      PASSWORD_SETUP_TOKEN_SECRET: docker_password_setup_secret
      PASSWORD_SETUP_TOKEN_TIME_IN_MS: 300000
      UI_URL: http://localhost:5173
      API_URL: http://localhost:5007
      COOKIE_DOMAIN: localhost
      NODE_ENV: development

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5007
    container_name: school_mgmt_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"

  go-service:
    build:
      context: ./go-service
    container_name: school_mgmt_go_service
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      NODE_API_URL: http://backend:5007
      NODE_API_USER: admin@school-admin.com
      NODE_API_PASSWORD: 3OU4zn3q6Zh9

volumes:
  postgres_data:
